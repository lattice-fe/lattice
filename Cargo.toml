[package]
name = "lattice"
version = "0.1.0"
edition = "2021"
description = "A Windows file explorer built with Rust and iced"

[dependencies]
iced = { version = "0.14", features = ["tokio", "svg"] }
chrono = "0.4"
tokio = { version = "1", features = ["rt"] }
trash = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
