[project]
name = "index"
version = "0.1.0"
description = "Permission-scoped document ingestion and indexing backbone"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "sqlite-vec>=0.1.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "litellm>=1.52",
    "python-pptx>=1.0.2",
    "unstructured[pdf,docx]>=0.16",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-multipart>=0.0.12",
    "tiktoken>=0.8",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
